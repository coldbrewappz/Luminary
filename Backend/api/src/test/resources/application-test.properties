# Test profile — in-memory H2, no external DB or secrets required.
# Overrides the production datasource/JWT placeholders from application.properties
# so the Spring context can boot offline in CI.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-secret-key-that-is-long-enough-for-hs256-algorithm-abc
jwt.expiration=86400000
